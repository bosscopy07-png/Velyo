version: '3.8'

services:
  app:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && npm start"

  worker-payout:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run worker:payout

  worker-deposit:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run worker:deposit

  worker-cleanup:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run worker:cleanup

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: veylo
      POSTGRES_PASSWORD: veylo_secret
      POSTGRES_DB: veylo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veylo -d veylo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # BullMQ requires noeviction — with allkeys-lru, Redis can silently
    # delete queued jobs and locks under memory pressure.
    # appendonly gives job data durability across Redis restarts.
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  redis_data:
  
